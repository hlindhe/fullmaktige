services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fullmaktige
      POSTGRES_USER: fullmaktige
      POSTGRES_PASSWORD: fullmaktige
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  postgres_data:
